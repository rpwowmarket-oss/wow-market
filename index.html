<html lang="en"><head><meta charset="utf-8"><title>Guild Market Explorer</title><link rel="icon" href="data:,">

<style>
:root{--bg:#121418;--panel:#1a1d23;--panel2:#20242b;--line:#2b3038;--text:#e7e3d9;--dim:#9b978d;--accent:#e2b54e;--good:#5fcf7a;--bad:#ec6f67;
 --q0:#9d9d9d;--q1:#ececec;--q2:#2fd650;--q3:#3d8eff;--q4:#b45cff;--q5:#ff8000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:10px 22px;border-bottom:1px solid var(--line);background:#0e1013;position:sticky;top:0;z-index:10}
header h1{font-size:16px;margin:0;color:var(--accent);font-weight:650;white-space:nowrap}
nav{display:flex;gap:2px;flex-wrap:wrap}nav button{background:none;border:0;color:var(--dim);font:inherit;padding:6px 11px;border-radius:6px;cursor:pointer}
nav button.on,nav button:hover{color:var(--text);background:var(--panel2)}
.asof{margin-left:auto;font-size:12px;color:var(--dim);white-space:nowrap}.asof.stale{color:var(--bad)}.gs{margin-left:12px;position:relative}.gs input{width:260px}
.sugg{position:absolute;top:36px;right:0;width:340px;background:#0e1013;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:none;z-index:30}

main{padding:18px 22px 40px;max-width:1380px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px}.panel .stat{background:var(--panel2)}
.stat b{display:block;font-size:19px;font-weight:600}.stat span{color:var(--dim);font-size:12px}
h2{font-size:15px;margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h2 small{color:var(--dim);font-weight:400;font-size:12px}

.g{color:#f2c94c}.s{color:#c9ced6}.c{color:#d08a4e}.up{color:var(--good)}.down{color:var(--bad)}.dim{color:var(--dim)}

a{color:var(--accent);cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:16px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;font-weight:400}.seg button{background:none;border:0;color:var(--dim);padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}

.cat b{cursor:pointer;display:block;margin-bottom:3px}.cat b:hover{color:var(--accent)}.cat div{display:flex;justify-content:space-between;padding:1px 0;color:var(--dim);cursor:pointer;font-size:13px}.cat div:hover{color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:3px 6px 3px 10px;font-size:12px}
.chip button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:13px}

details.wl>summary{cursor:pointer;list-style:none}details.wl>summary::-webkit-details-marker{display:none}details.wl>summary h2{margin:0}details.wl[open]>summary h2{margin-bottom:10px}
.arr{display:inline-block;color:var(--dim);transition:transform .15s}details.wl[open] .arr{transform:rotate(90deg)}details.wl>summary:hover h2{color:var(--accent)}
</style></head><body>
<header><h1>⚖ Market Explorer</h1><nav id="nav"></nav><span class="asof" id="asof"></span>
<div class="gs"><input id="gsq" type="search" placeholder="Find an item…" autocomplete="off"><div class="sugg" id="sugg"></div></div></header>
<main id="main"></main><div id="tip"></div>
<script>
const $=s=>document.querySelector(s), M=$('#main'), TIP=$('#tip');
const TABS=[['market','Market'],['browse','Browse'],['crafts','Crafts'],['writs','Writs'],['ideas','Buy ideas'],['watch','Watch lists'],['compare','Compare'],['data','Data coverage']];
const COLORS=['#e2b54e','#5b9cf0','#5fcf7a','#c27df0','#ec6f67','#4fd1c5'];
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let S={tab:'market'}, CMP=[]; try{CMP=JSON.parse(lsGet('cmp')||'[]')}catch(e){CMP=[]}
// ================= DATA LAYER (static files instead of a server) =================
// Everything is read from data/*.json.gz. Files are gzip; decompressed here with DecompressionStream
// (if the host already decompressed them, the gzip magic bytes are missing and we just parse the text).
let BUILT='';
const _c={};
function gz(path){ if(_c[path]) return _c[path];
  return _c[path]=(async()=>{
    const isMeta=path==='meta.json';
    if(!isMeta) await META();
    const r=await fetch('data/'+path+(isMeta?'?t='+Date.now():(BUILT?'?v='+BUILT:'')),isMeta?{cache:'no-store'}:{});
    if(!r.ok) throw new Error('Could not load data/'+path+' (HTTP '+r.status+'). The site data may still be publishing; try again in a minute.');
    let b=new Uint8Array(await r.arrayBuffer());
    if(b[0]===0x1f&&b[1]===0x8b){
      if(typeof DecompressionStream==='undefined') throw new Error('This browser is too old to open the data files. Use a current Chrome, Edge or Firefox.');
      b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()); }
    return JSON.parse(new TextDecoder().decode(b)); })().catch(e=>{ delete _c[path]; throw e; }); }
let _meta; function META(){ return _meta||(_meta=gz('meta.json').then(m=>{ BUILT=String(m.built_at); return m; }).catch(e=>{ _meta=null; throw e; })); }
const dayTs=day=>Date.parse(day+'T00:00:00Z')/1000+43200;

let CL={}, SC={};
const cname=c=>c==null?'Unknown':(CL[c]||'Class '+c);
const sname=(c,s)=>s==null?'Unknown':((SC[c]||{})[s]||'Type '+s);
let _T; function T(){ return _T||(_T=(async()=>{
  const t=await gz('tables.json.gz'); CL=t.classes; SC=t.subclasses;
  const items=new Map(); for(const r of t.items) items.set(r[0],{item_id:r[0],name:r[1],quality:r[2],ilvl:r[3],class_id:r[4],subclass_id:r[5],stack:r[6],vendor_sell:r[7],is_crafted:r[8]});
  const recipes=new Map(t.recipes.map(r=>[r[0],{recipe_id:r[0],profession:r[1],output_item:r[2],output_count:r[3],name:r[4]}]));
  const reagentsBy=new Map(), usedBy=new Map(), byOut=new Map();
  const push=(m,k,v)=>{ let a=m.get(k); if(!a) m.set(k,a=[]); a.push(v); };
  for(const r of t.reagents){ const g={recipe_id:r[0],reagent_item:r[1],qty:r[2],slot:r[3]}; push(reagentsBy,r[0],g); push(usedBy,r[1],g); }
  for(const r of recipes.values()) push(byOut,r.output_item,r);
  const vendor=new Map(t.vendor.map(r=>[r[0],{unit_price:r[1],limited:r[2]}]));
  return {items,recipes,reagentsBy,usedBy,byOut,vendor}; })()); }
let _B; function B(){ return _B||(_B=gz('computed/browse.json.gz')); }
let _MET; function MET(){ return _MET||(_MET=(async()=>{
  const j=await gz('computed/metrics.json.gz'), met=new Map(), stat=new Map();
  for(const [id,row] of Object.entries(j.rows)){ const o={item_id:+id}; j.cols.forEach((c,k)=>o[c]=row[k]); met.set(+id,o); }
  for(const [id,row] of Object.entries(j.stats)){ const o={}; j.stat_cols.forEach((c,k)=>o[c]=row[k]); stat.set(+id,o); }
  return {met,stat}; })()); }
let _CR; function CR(){ return _CR||(_CR=(async()=>{ const j=await gz('computed/crafts.json.gz'); return {professions:j.professions,rows:j.rows,by:new Map(j.rows.map(r=>[r.recipe_id,r]))}; })()); }
const mgSort=(a,b)=>(b==null?-1e12:b)-(a==null?-1e12:a);

// Daily series for some items over the last `rng` days ('all' = everything). Loads only the monthly files needed.
async function getDaily(ids,rng){
  const meta=await META(), last=meta.last_day; if(!last) return {};
  let cut=null; if(rng!=='all'){ const d=new Date(last+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()-(+rng-1)); cut=d.toISOString().slice(0,10); }
  const files=await Promise.all(meta.months.filter(m=>!cut||m>=cut.slice(0,7)).map(m=>gz('daily/'+m+'.json.gz')));
  const out={};
  for(const id of ids){ const rows=[];
    for(const f of files){ const a=f.items[id]; if(!a) continue;
      for(const r of a){ const day=f.month+'-'+String(r[0]).padStart(2,'0'); if(cut&&day<cut) continue; rows.push([dayTs(day),r[1],r[2],r[3],r[4]?'scans':'auctionator']); } }
    rows.sort((a,b)=>a[0]-b[0]); out[id]=rows; }
  return out; }

// Individual scans for one item over the last `rng` days of scanning.
function decodeDay(f){ if(f._idx) return f._idx; const idx=new Map();
  for(const s of f.scans){ let id=0; for(let k=0;k<s.ids.length;k++){ id+=s.ids[k]; let a=idx.get(id); if(!a) idx.set(id,a=[]); a.push({t:s.t,min_price:s.min[k],median_price:s.med[k],qty:s.qty[k],listings:s.n[k]}); } }
  return f._idx=idx; }
async function getScans(id,rng){
  const meta=await META(); let days=meta.scan_days; if(!days.length) return [];
  if(rng!=='all'){ const d=new Date(days[days.length-1]+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()-(+rng-1)); const cut=d.toISOString().slice(0,10); days=days.filter(x=>x>=cut); }
  const files=await Promise.all(days.map(d=>gz('scans/'+d+'.json.gz')));
  return files.flatMap(f=>decodeDay(f).get(id)||[]).sort((a,b)=>a.t-b.t); }

async function recipeHistory(d,rng){
  const ids=[d.recipe.output_item,...d.reagents.map(g=>g.item_id)], S2=await getDaily(ids,rng);
  const mp=id=>new Map((S2[id]||[]).map(r=>[r[0],r[1]]));
  const outS=mp(d.recipe.output_item), regs=d.reagents.map(g=>({s:mp(g.item_id),qty:g.qty,v:g.vendor_buy})), h=[];
  for(const [ts,lo] of outS){ let cost=0, ok=true;
    for(const g of regs){ const p=[g.s.get(ts),g.v].filter(x=>x); if(!p.length){ ok=false; break; } cost+=Math.min(...p)*g.qty; }
    if(ok){ const sale=lo*(d.recipe.output_count||1); h.push([ts,sale,cost,Math.round(sale*0.95-cost)]); } }
  return h; }

const API={
  async overview(){ return gz('computed/overview.json.gz'); },
  async categories(){ const [tb,b]=await Promise.all([T(),B()]), cats=new Map();
    for(const inf of tb.items.values()){ const k=inf.class_id+'|'+inf.subclass_id; let e=cats.get(k); if(!e) cats.set(k,e={cl:inf.class_id,sc:inf.subclass_id,n:0,listed:0});
      e.n++; const r=b.rows[inf.item_id]; if(r&&r[0]) e.listed++; }
    const out=new Map();
    for(const e of cats.values()){ let g=out.get(e.cl); if(!g) out.set(e.cl,g={class_id:e.cl,name:cname(e.cl),items:0,listed:0,subs:[]});
      g.items+=e.n; g.listed+=e.listed; g.subs.push({subclass_id:e.sc,name:sname(e.cl,e.sc),items:e.n,listed:e.listed}); }
    for(const g of out.values()) g.subs.sort((a,b)=>b.listed-a.listed);
    return [...out.values()].sort((a,b)=>b.listed-a.listed); },
  async browse(q){ const [tb,b]=await Promise.all([T(),B()]);
    const term=(q.get('q')||'').trim().toLowerCase(), cl=q.get('class')||'', sc=q.get('sub')||'', minq=+(q.get('quality')??-1), listed=(q.get('listed')??'1')==='1', sort=q.get('sort')||'listings', page=+(q.get('page')||0), per=50;
    let res=[];
    for(const inf of tb.items.values()){ const i=inf.item_id, nm=inf.name;
      if(term&&!nm.toLowerCase().includes(term)&&term!==String(i)) continue;
      if(cl!==''&&String(inf.class_id)!==cl) continue; if(sc!==''&&String(inf.subclass_id)!==sc) continue;
      if(minq>=0&&(inf.quality??-1)<minq) continue;
      const r=b.rows[i]||[]; if(listed&&!r[0]) continue;
      res.push({item_id:i,name:nm,quality:inf.quality,ilvl:inf.ilvl,cls:cname(inf.class_id),sub:sname(inf.class_id,inf.subclass_id),price:r[0],usual:r[1],listings:r[2],qty:r[3],ch1:r[4],ch7:r[5],spark:r[6]||[]}); }
    const keyf={listings:r=>-(r.listings||0),price:r=>-(r.price||0),name:r=>r.name,ch7:r=>-(r.ch7??-9),ch7a:r=>(r.ch7??9),qty:r=>-(r.qty||0),ilvl:r=>-(r.ilvl||0)}[sort]||(r=>-(r.listings||0));
    res.sort((a,b2)=>{ const x=keyf(a), y=keyf(b2); return typeof x==='string'?x.localeCompare(y):x-y; });
    return {total:res.length,page,per,rows:res.slice(page*per,(page+1)*per)}; },
  async suggest(q){ const term=(q.get('q')||'').trim().toLowerCase(); if(term.length<2) return [];
    const [tb,b]=await Promise.all([T(),B()]), res=[];
    for(const inf of tb.items.values()){ if(!inf.name.toLowerCase().includes(term)) continue; const r=b.rows[inf.item_id]||[];
      res.push({item_id:inf.item_id,name:inf.name,quality:inf.quality,current_price:r[0],listings:r[2]||0}); }
    res.sort((a,b2)=>((a.current_price?0:1)-(b2.current_price?0:1))||(b2.listings-a.listings)); return res.slice(0,12); },
  async item(q){ const id=+q.get('id'), [tb,b,mm,cr]=await Promise.all([T(),B(),MET(),CR()]), inf=tb.items.get(id);
    if(!inf) throw new Error('Unknown item #'+id);
    const r=b.rows[id]||[], st=mm.stat.get(id)||{}, ven=tb.vendor.get(id);
    const made_by=(tb.byOut.get(id)||[]).map(x=>{ const m=cr.by.get(x.recipe_id)||{}; return {recipe_id:x.recipe_id,name:x.name,profession:x.profession,output_count:x.output_count,reagent_cost:m.reagent_cost,margin:m.margin,status:m.status}; }).sort((a,b2)=>mgSort(a.margin,b2.margin));
    const used_in=(tb.usedBy.get(id)||[]).map(g=>{ const x=tb.recipes.get(g.recipe_id), m=cr.by.get(g.recipe_id)||{}, oi=tb.items.get(x.output_item)||{}; return {recipe_id:x.recipe_id,name:x.name,profession:x.profession,qty:g.qty,margin:m.margin,status:m.status,output_item:x.output_item,quality:oi.quality}; })
      .sort((a,b2)=>mgSort(a.margin,b2.margin)).slice(0,60);
    return {info:{...inf,cls:cname(inf.class_id),sub:sname(inf.class_id,inf.subclass_id)}, metrics:mm.met.get(id)||null, vendor:ven||null,
      stats:{days:st.days||0,first:st.first,all_low:st.all_low,all_high:st.all_high,median:st.median,avg_qty:st.avg_qty,ch1:r[4],ch7:r[5],ch30:st.ch30}, made_by, used_in}; },
  async compare(q){ const tb=await T(); return (q.get('ids')||'').split(',').filter(x=>/^\d+$/.test(x.trim())).map(x=>{ const inf=tb.items.get(+x)||{}; return {item_id:+x,name:inf.name,quality:inf.quality}; }); },
  async crafts(q){ const cr=await CR(), prof=q.get('prof')||'', minl=+(q.get('min_listings')||3), status=q.get('status')||'ok';
    const rows=cr.rows.filter(r=>r.status===status&&(status!=='ok'||(r.out_listings||0)>=minl)&&(!prof||r.profession===prof)).sort((a,b)=>mgSort(a.margin,b.margin)).slice(0,500);
    return {professions:cr.professions,rows}; },
  async recipe(q){ const id=+q.get('id'), [tb,cr,mm]=await Promise.all([T(),CR(),MET()]), r=tb.recipes.get(id); if(!r) throw new Error('Unknown recipe #'+id);
    const oi=tb.items.get(r.output_item)||{};
    const reagents=(tb.reagentsBy.get(id)||[]).slice().sort((a,b)=>a.slot-b.slot).map(g=>{ const inf=tb.items.get(g.reagent_item)||{}, m=mm.met.get(g.reagent_item)||{}, v=tb.vendor.get(g.reagent_item);
      return {item_id:g.reagent_item,qty:g.qty,slot:g.slot,name:inf.name,quality:inf.quality,current_price:m.current_price,expected_rate:m.expected_rate,listings:m.listings,ah_qty:m.qty,slope7:m.slope7,vendor_buy:v?v.unit_price:null}; });
    return {recipe:{...r,output_name:oi.name,output_quality:oi.quality}, margin:cr.by.get(id)||null, reagents}; },
  async signals(q){ const mf=+(q.get('max_fall')??-0.05), mp=+(q.get('min_price')??5000); const j=await gz('computed/signals.json.gz');
    return j.rows.filter(r=>r.current_price>=mp&&(r.slope7==null||r.slope7>=mf)).slice(0,150); },
  async watch(){ return gz('computed/watch.json.gz'); },
  async disenchant(){ return (await gz('computed/disenchant.json.gz')).rows; },
  async writs(){ return gz('computed/writs.json.gz'); },
};
async function api(p){ const i=p.indexOf('?'), name=i<0?p:p.slice(0,i), q=new URLSearchParams(i<0?'':p.slice(i+1)); const f=API[name]; if(!f) throw new Error('Unknown data request: '+name); return f(q); }
const STALE_H=24;
async function staleHtml(){ const m=await META(); if(!m.data_as_of) return '<div class="warn">No scan data has been published yet.</div>';
  const h=(Date.now()/1000-m.data_as_of)/3600;
  return h>STALE_H?`<div class="warn">These prices are ${h<48?Math.round(h)+' hours':Math.round(h/24)+' days'} old. The site is only updated when the owner publishes a new scan, so treat them with care.</div>`:''; }
async function setAsof(){ const m=await META(), el=$('#asof'); if(!m.data_as_of){ el.textContent='no data yet'; return; }
  const h=(Date.now()/1000-m.data_as_of)/3600; el.textContent='Data as of '+new Date(m.data_as_of*1000).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); el.title=m.realm||''; el.classList.toggle('stale',h>STALE_H); }
// ================= END DATA LAYER =================
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(c,plain){ if(c==null||isNaN(c)) return plain?'–':'<span class="dim">–</span>'; c=Math.round(c); const neg=c<0; c=Math.abs(c);
  const g=Math.floor(c/10000), s=Math.floor(c%10000/100), cc=c%100; let o=[];
  const G=plain?'g':'<span class="g">g</span>', Sx=plain?'s':'<span class="s">s</span>', C=plain?'c':'<span class="c">c</span>';

function spark(pts,w=110,h=26){ if(!pts||pts.length<2) return '<span class="dim">–</span>';
  const v=pts.map(p=>Array.isArray(p)?p[1]:p), mn=Math.min(...v), mx=Math.max(...v), r=mx-mn||1;
  const P=pts.map((p,i)=>`${(i/(pts.length-1)*(w-4)+2).toFixed(1)},${(h-3-(v[i]-mn)/r*(h-6)).toFixed(1)}`).join(' ');
  const col=v[v.length-1]>v[0]*1.02?'var(--good)':v[v.length-1]<v[0]*0.98?'var(--bad)':'var(--dim)';
  return `<svg width="${w}" height="${h}" style="vertical-align:middle"><polyline fill="none" stroke="${col}" stroke-width="1.6" points="${P}"/></svg>`; }

// ---------- main chart. series: {name,pts:[[t,v]],color,type:'line'|'area'|'bar'|'dots'|'band',axis:'l'|'r',fmt,dash,w,pts2(band lower edge)}
function niceStep(raw){ const mag=Math.pow(10,Math.floor(Math.log10(raw||1))); return [1,2,2.5,5,10].map(k=>k*mag).find(k=>k>=raw); }
function chart(el,series,o={}){
  const H=o.height||300, W=Math.max(320,el.clientWidth||1000), P={l:o.padL||78,r:o.right?62:18,t:12,b:28};
  const all=series.flatMap(s=>[...s.pts,...(s.pts2||[])]).filter(p=>p[1]!=null); if(!all.length){el.innerHTML='<p class="dim">No data for this range yet.</p>';return}
  let x0=Math.min(...all.map(p=>p[0])), x1=Math.max(...all.map(p=>p[0])); if(x1==x0){x0-=43200;x1+=43200}
  const bs=series.find(s=>s.type=='bar'); if(bs&&bs.pts.length){const pad=(x1-x0)/Math.max(6,bs.pts.length)*0.6; x0-=pad; x1+=pad;}
  const scale=ax=>{ const v=series.filter(s=>(s.axis||'l')==ax).flatMap(s=>[...s.pts,...(s.pts2||[])].map(p=>p[1])).filter(x=>x!=null); if(!v.length) return null;
    let lo=Math.min(...v), hi=Math.max(...v);
    if(o.log&&ax=='l'){ lo=Math.max(1,lo*0.8); hi=hi*1.25; const L=x=>Math.log10(Math.max(x,1)); return {lo,hi,f:x=>(L(x)-L(lo))/(L(hi)-L(lo)||1),log:1}; }
    if(!(o.zero===false&&ax=='l')) lo=Math.min(0,lo); else {const pad=(hi-lo)*0.15||Math.abs(hi)*0.1||1; const mn=lo; lo=lo-pad; hi=hi+pad; if(mn>=0) lo=Math.max(0,lo);}
    const st=niceStep((hi-lo)/4||1); lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st; if(hi==lo) hi=lo+st; return {lo,hi,st,f:x=>(x-lo)/(hi-lo)}; };
  const SL=scale('l'), SR=o.right?scale('r'):null;
  const X=x=>P.l+(x-x0)/(x1-x0)*(W-P.l-P.r), Y=(y,s)=>H-P.b-s.f(y)*(H-P.t-P.b);
  let g='';
  if(SL){ let ticks=[]; if(SL.log){ for(let e=Math.floor(Math.log10(SL.lo));e<=Math.ceil(Math.log10(SL.hi));e++) for(const k of [1,2,5]){const v=k*10**e; if(v>=SL.lo&&v<=SL.hi) ticks.push(v)} }
    else for(let v=SL.lo;v<=SL.hi+SL.st*1e-6;v+=SL.st) ticks.push(v);
    const lf=(series.find(s=>(s.axis||'l')=='l'&&s.fmt)||{}).fmt||(v=>v);
    for(const v of ticks) g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v,SL)}" y2="${Y(v,SL)}" stroke="#262a31"/><text x="${P.l-8}" y="${Y(v,SL)+4}" text-anchor="end">${lf(v,true)}</text>`; }
  if(SR){ const rf=(series.find(s=>s.axis=='r'&&s.fmt)||{}).fmt||(v=>v); for(let v=SR.lo;v<=SR.hi+SR.st*1e-6;v+=SR.st) g+=`<text x="${W-P.r+8}" y="${Y(v,SR)+4}">${rf(v,true)}</text>`; }
  const span=(x1-x0)/86400; const step=span>60?14:span>25?7:span>10?2:span>2.5?1:0;
  if(step){ for(let t=Math.ceil(x0/86400)*86400+43200;t<=x1;t+=86400*step) if(t>=x0) g+=`<text x="${X(t)}" y="${H-8}" text-anchor="middle">${new Date(t*1000).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text>`; }
  else { const n=Math.max(2,Math.min(7,Math.floor((W-P.l-P.r)/150))); for(let k=0;k<=n;k++){ const t=x0+(x1-x0)*k/n; const dt=new Date(t*1000);
    g+=`<text x="${X(t)}" y="${H-8}" text-anchor="${k==0?'start':k==n?'end':'middle'}">${span>0.8?dt.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' ':''}${dt.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}</text>`; } }
  if(o.refY!=null&&SL&&o.refY>=SL.lo&&o.refY<=SL.hi) g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(o.refY,SL)}" y2="${Y(o.refY,SL)}" stroke="#7a7461" stroke-dasharray="4 4"/>`;
  for(const s of series){ const sc=(s.axis||'l')=='r'?SR:SL; if(!sc) continue; const pts=s.pts.filter(p=>p[1]!=null).sort((a,b)=>a[0]-b[0]); if(!pts.length) continue;
    const base=Y(Math.max(sc.lo,Math.min(0,sc.hi)),sc);
    if(s.type=='bar'){ const bw=Math.max(2,Math.min(26,(W-P.l-P.r)/pts.length*0.55)); g+=pts.map(p=>`<rect x="${X(p[0])-bw/2}" y="${Math.min(Y(p[1],sc),base)}" width="${bw}" height="${Math.abs(base-Y(p[1],sc))}" fill="${s.color}" opacity="${s.opacity||0.35}" rx="2"/>`).join(''); continue; }
    if(s.type=='band'){ const dn=(s.pts2||[]).filter(p=>p[1]!=null).sort((a,b)=>b[0]-a[0]); g+=`<polygon fill="${s.color}" opacity="0.13" points="${[...pts,...dn].map(p=>X(p[0]).toFixed(1)+','+Y(p[1],sc).toFixed(1)).join(' ')}"/>`; continue; }
    const line=pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1],sc).toFixed(1)).join(' ');
    if(s.type=='area') g+=`<polygon fill="${s.color}" opacity="0.13" points="${X(pts[0][0])},${base} ${line} ${X(pts[pts.length-1][0])},${base}"/>`;
    if(s.type!='dots') g+=`<polyline fill="none" stroke="${s.color}" stroke-width="${s.w||2}" ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round" points="${line}"/>`;
    if(s.type=='dots'||(pts.length<40&&!s.dash)) g+=pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1],sc)}" r="${s.type=='dots'?2.6:2}" fill="${s.color}"/>`).join(''); }
  el.innerHTML=`<svg width="${W}" height="${H}">${g}<line class="xh" y1="${P.t}" y2="${H-P.b}" stroke="#888" stroke-dasharray="3 3" style="display:none"/><rect x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}" fill="transparent"/></svg>`;
  const svg=el.querySelector('svg'), xh=svg.querySelector('.xh'), xs=[...new Set(series.flatMap(s=>s.pts.filter(p=>p[1]!=null).map(p=>p[0])))].sort((a,b)=>a-b);
  svg.onmouseleave=()=>{TIP.style.display='none'; xh.style.display='none'};
  svg.onmousemove=e=>{ const r=svg.getBoundingClientRect(), mx=e.clientX-r.left; if(mx<P.l||mx>W-P.r||!xs.length){svg.onmouseleave();return}
    const t=x0+(mx-P.l)/(W-P.l-P.r)*(x1-x0); let best=xs[0]; for(const x of xs) if(Math.abs(x-t)<Math.abs(best-t)) best=x;
    xh.setAttribute('x1',X(best)); xh.setAttribute('x2',X(best)); xh.style.display='';
    const seen=new Set(); const lines=series.filter(s=>s.name&&s.type!='band').map(s=>{ if(seen.has(s.name)) return ''; seen.add(s.name); const p=s.pts.find(p=>p[0]==best&&p[1]!=null);
      return p?`<div class="r"><span style="color:${s.color}">${esc(s.name)}</span><b>${(s.fmt||(v=>v))(p[1])}</b></div>`:''}).join('');
    const dt=new Date(best*1000); TIP.innerHTML=`<div class="dim">${o.daily?dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}):dt.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>${lines}`;
    TIP.style.display='block'; TIP.style.left=Math.min(e.clientX+14,innerWidth-220)+'px'; TIP.style.top=(e.clientY+14)+'px'; };
}

function suggestBox(input,box,onPick,onEnter){ let t, sel=-1, items=[];
  const show=()=>{ box.innerHTML=items.map((r,i)=>`<div class="${i==sel?'sel':''}" data-i="${i}"><span class="q${r.quality??1}">${esc(r.name)}</span><span>${r.current_price?money(r.current_price):'<span class="dim">not listed</span>'}</span></div>`).join(''); box.style.display=items.length?'block':'none';
    box.querySelectorAll('div').forEach(d=>d.onmousedown=()=>pick(items[+d.dataset.i])); };
  const pick=r=>{ if(!r) return; box.style.display='none'; input.value=''; onPick(r); };
  input.oninput=()=>{clearTimeout(t); t=setTimeout(async()=>{ items=await api('suggest?q='+encodeURIComponent(input.value)); sel=-1; show(); },180)};
  input.onkeydown=e=>{ if(e.key=='ArrowDown'){sel=Math.min(sel+1,items.length-1);show();e.preventDefault()} else if(e.key=='ArrowUp'){sel=Math.max(sel-1,0);show();e.preventDefault()}
    else if(e.key=='Enter'){ if(sel>=0) pick(items[sel]); else if(onEnter){box.style.display='none'; onEnter(input.value); input.value='';} } else if(e.key=='Escape') box.style.display='none'; };
  input.onblur=()=>setTimeout(()=>box.style.display='none',150); }

async function data(){
  const m=await META(), days=Object.entries(m.scans_by_day), n=days.length, tot=m.scans_published;
  const mb=b=>(b/1e6).toFixed(2)+' MB', fd=t=>t?new Date(t*1000).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}):'–';
  const yrs=m.growth_per_year>0?Math.max(0,(1e9-m.site_bytes)/m.growth_per_year):null;
  M.innerHTML=`<div class="panel"><h2>Data coverage <small>what this site contains</small></h2>
   <div class="grid" style="margin:10px 0 0">
    <div class="stat"><b>${fd(m.first_scan)}</b><span>first scan</span></div>
    <div class="stat"><b>${fd(m.last_scan)}</b><span>latest scan</span></div>
    <div class="stat"><b>${tot.toLocaleString()}</b><span>individual scans kept · ${n?(tot/n).toFixed(1):0} per scanning day</span></div>
    <div class="stat"><b>${m.items.toLocaleString()}</b><span>items known · ${m.priced.toLocaleString()} with price history</span></div>
    <div class="stat"><b>${m.days}</b><span>days of daily history (${m.first_day||'–'} → ${m.last_day||'–'})</span></div>
    <div class="stat"><b>${m.recipes.toLocaleString()}</b><span>recipes captured</span></div></div></div>
  <div class="two"><div class="panel"><h2>Scans per day</h2><div class="chart" id="cSD"></div></div>
   <div class="panel"><h2>Site size <small>compressed, counts toward GitHub's 1 GB limit</small></h2>
    <table><thead><tr><th>Part</th><th class="n">Files</th><th class="n">Size</th></tr></thead><tbody>${Object.entries(m.groups).map(([k,g])=>`<tr><td>${esc(k)}</td><td class="n">${g.files}</td><td class="n">${mb(g.bytes)}</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td></td><td class="n"><b>${mb(m.site_bytes)}</b></td></tr></tbody></table>
    ${yrs!=null?`<p class="dim">At the current pace the site grows roughly ${mb(m.growth_per_year)} a year, so about ${yrs.toFixed(0)} years of room remain.</p>`:''}</div></div>
  <div class="panel"><h2>Where the numbers come from</h2><p class="dim">Prices before the first scan come from Auctionator's daily lows (from launch). After that, daily history is built from the owner's full auction house scans, and every individual scan is kept. Each scan stores, per item, the lowest listing, the typical (median) listing, units and number of listings. Nothing about sellers or players is collected. Recipes come from profession windows opened in game; craft profit is after the 5% auction house cut and ignores deposits.</p></div>`;
  chart($('#cSD'),[{name:'Scans',pts:days.map(([d,c])=>[dayTs(d),c]),color:'#5b9cf0',type:'bar',fmt:fmtNum,opacity:.8}],{height:240,daily:1,padL:40});
}

(async function start(){ try{ await META(); await setAsof(); }catch(e){ M.innerHTML=`<div class="panel err">${esc(e.message)}</div>`; return; } const h=location.hash.slice(1).split('/'); const ok=TABS.some(x=>x[0]==h[0])||['item','recipe'].includes(h[0]);
  go(ok?h[0]:'market',h[1]?{id:+h[1]}:{},false); history.replaceState(S,'','#'+S.tab+(S.id?'/'+S.id:'')); })();
let RZ; window.addEventListener('resize',()=>{ clearTimeout(RZ); RZ=setTimeout(()=>{ if(['market','item','compare','recipe'].includes(S.tab)) render(); },350); });
</script></body></html>
